<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Game: Collector Edition</title>
    <style>
        :root {
            --primary: #673ab7;
            --success: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --info: #2196f3;
            --dino: #4caf50;
            --bg: #f0f2f5;
        }
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: #333;
        }
        nav { 
            background: #222; 
            padding: 15px; 
            display: flex; 
            justify-content: space-around; 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        nav button { 
            color: white; 
            background: none; 
            border: none; 
            font-weight: bold; 
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
        }
        .page { padding: 20px; max-width: 500px; margin: 0 auto; display: none; text-align: center; }
        .active { display: block; }
        
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
            position: relative;
            overflow: hidden;
        }
        .big-score { font-size: 4rem; font-weight: bold; margin: 10px 0; }
        .btn { 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            color: white; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { opacity: 0.7; transform: scale(0.98); }
        .grid { display: grid; gap: 10px; }
        .shop-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        .inventory-img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid var(--primary); }
        
        .tag {
            position: absolute;
            top: 10px;
            right: -30px;
            background: var(--warning);
            color: white;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <button onclick="showPage('game')">Game</button>
        <button onclick="showPage('shop')">Shop</button>
        <button onclick="showPage('profile')">Profile</button>
    </nav>

    <div id="page-game" class="page active">
        <div class="card" style="border-left: 5px solid var(--primary);">
            <small>Global Bank</small><br>
            <strong id="bank-val" style="font-size: 1.5rem; color: var(--primary);">0</strong> pts
        </div>

        <div class="big-score" id="session-val">0</div>
        <div id="status-tag" style="font-weight: bold; margin-bottom: 20px; color: var(--danger);">● PAUSED</div>

        <div class="grid" style="grid-template-columns: 1fr 1fr;">
            <button id="start-btn" class="btn" style="background: var(--success);" onclick="toggleTimer()">START</button>
            <button class="btn" style="background: #9e9e9e;" onclick="resetSession()">RESET</button>
            
            <button class="btn" style="background: #3f51b5; grid-column: span 2;" onclick="addE(10)">🧼 WASH HANDS (+10)</button>

            <button class="btn" style="background: var(--warning);" onclick="addE(2)">Eat Rice (+2)</button>
            <button class="btn" style="background: var(--info);" onclick="addE(1)">Eat Fish (+1)</button>
            <button class="btn" style="background: var(--success); grid-column: span 2;" onclick="addE(1)">Eat Vegi (+1)</button>

            <button class="btn" style="background: var(--primary); grid-column: span 2; margin-top: 10px;" onclick="saveToBank()">SAVE TO BANK 💰</button>
        </div>
    </div>

    <div id="page-shop" class="page">
        <h2>Collector Shop</h2>
        <p>Your Balance: <strong class="bank-total">0</strong> pts</p>
        <div id="shop-items" class="grid"></div>
    </div>

    <div id="page-profile" class="page">
        <h2>My Collection</h2>
        <div id="inventory" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
    </div>

    <script>
        let state = {
            session: 0,
            bank: parseInt(localStorage.getItem('bank')) || 0,
            inventory: JSON.parse(localStorage.getItem('inventory')) || [],
            isPaused: true
        };

        const itemsForSale = [
            // Dino Series - 50 pts
            { id: 1, name: "T-Rex Figure", price: 50, img: "https://images.unsplash.com/photo-1559767614-7d40944356d6?q=80&w=400&auto=format&fit=crop", series: "Dino" },
            { id: 2, name: "Triceratops Figure", price: 50, img: "https://images.unsplash.com/photo-1525833323545-2dcf3760593d?q=80&w=400&auto=format&fit=crop", series: "Dino" },
            { id: 3, name: "Velociraptor Figure", price: 50, img: "https://images.unsplash.com/photo-1615110158413-577f19cd7823?q=80&w=400&auto=format&fit=crop", series: "Dino" },
            // Elite Series - 500 pts
            { id: 101, name: "Power Ranger Mecha", price: 500, img: "https://m.media-amazon.com/images/I/718y9S0-HXL._AC_SL1500_.jpg", series: "Elite" },
            { id: 102, name: "Destiny Mecha Unit", price: 500, img: "https://m.media-amazon.com/images/I/71k6Fp87VjL._AC_SL1200_.jpg", series: "Elite" },
            { id: 103, name: "Thunder Megazord", price: 500, img: "https://m.media-amazon.com/images/I/71Y72e3-X5L._AC_SL1500_.jpg", series: "Elite" }
        ];

        let drainInterval = null;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            render();
        }

        function toggleTimer() {
            state.isPaused = !state.isPaused;
            if (!state.isPaused) {
                drainInterval = setInterval(() => {
                    if (state.session > 0) {
                        state.session--;
                        render();
                    }
                }, 15000);
            } else {
                clearInterval(drainInterval);
            }
            render();
        }

        function addE(pts) {
            if (!state.isPaused) {
                state.session += pts;
                render();
            } else {
                alert("Tap START to begin!");
            }
        }

        function resetSession() {
            state.session = 0;
            render();
        }

        function saveToBank() {
            if(state.session === 0) return alert("Nothing to save!");
            state.bank += state.session;
            state.session = 0;
            saveData();
            render();
        }

        function buyItem(id) {
            const item = itemsForSale.find(i => i.id === id);
            if (state.bank >= item.price) {
                state.bank -= item.price;
                state.inventory.push(item);
                saveData();
                render();
            } else {
                alert("Not enough points in the bank!");
            }
        }

        function saveData() {
            localStorage.setItem('bank', state.bank);
            localStorage.setItem('inventory', JSON.stringify(state.inventory));
        }

        function render() {
            document.getElementById('bank-val').innerText = state.bank;
            document.querySelectorAll('.bank-total').forEach(el => el.innerText = state.bank);
            document.getElementById('session-val').innerText = state.session;
            
            const status = document.getElementById('status-tag');
            status.innerText = state.isPaused ? "● PAUSED" : "● RUNNING (-1 / 15s)";
            status.style.color = state.isPaused ? "var(--danger)" : "var(--success)";
            
            const sBtn = document.getElementById('start-btn');
            sBtn.innerText = state.isPaused ? "START" : "PAUSE";
            sBtn.style.background = state.isPaused ? "var(--success)" : "var(--danger)";

            const shop = document.getElementById('shop-items');
            shop.innerHTML = '';
            itemsForSale.forEach(item => {
                const isOwned = state.inventory.some(i => i.id === item.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="tag" style="background:${item.series === 'Dino' ? 'var(--success)' : 'var(--primary)'}">${item.series}</div>
                    <img src="${item.img}" class="shop-img" onerror="this.src='https://via.placeholder.com/200?text=Toy+Figure'">
                    <strong>${item.name}</strong><br>
                    <small>${item.price} Points</small><br><br>
                    <button class="btn" style="background: ${isOwned ? '#ccc' : 'var(--primary)'}; width: 100%; padding: 10px;" 
                        onclick="buyItem(${item.id})" ${isOwned ? 'disabled' : ''}>
                        ${isOwned ? 'OWNED' : 'BUY'}
                    </button>
                `;
                shop.appendChild(card);
            });

            const inv = document.getElementById('inventory');
            inv.innerHTML = state.inventory.length ? '' : '<p>Empty collection...</p>';
            state.inventory.forEach(item => {
                const img = document.createElement('img');
                img.src = item.img;
                img.className = 'inventory-img';
                img.title = item.name;
                inv.appendChild(img);
            });
        }

        render();
    </script>
</body>
</html>
